name: deploy component catalog

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download catalog static artifact
        run: |
          curl --fail --location 'https://sdmntprindiasocentral.oaiusercontent.com/files/00000000-8abc-8211-8d2f-68ff4913e81f/raw?se=2026-10-02T14%3A48%3A59Z&sp=r&sv=2026-02-06&sr=b&scid=d3b17d6c-1a82-5570-870e-2fe5da2ffe03&skoid=9063adf3-a524-4acf-b70a-8731b33f2f50&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-10-02T02%3A37%3A01Z&ske=2026-10-03T02%3A37%3A01Z&sks=b&skv=2026-02-06&sig=Km99VuYaEUfCBk0e5HZplGx5u4/sy3xlaicQUZlFz84%3D' --output /tmp/catalog.zip
          mkdir -p site
          unzip -q /tmp/catalog.zip -d site
          sed -i 's#/planes-webkit/#/planes-webkit-catalog/#g' site/index.html
      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
